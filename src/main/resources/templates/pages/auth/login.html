<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body th:attr="data-page=${pageName}">
<header th:replace="~{fragments/layout :: siteHeader}"></header>
<section th:replace="~{fragments/layout :: flash}"></section>

<main class="auth-split-bg">
    <div class="auth-split-card">

        <!-- LEFT: branding -->
        <div class="auth-split-left">
            <div class="brand-icon">
                <img th:src="@{/images/logo.png}" alt="YCI">
            </div>
            <div class="brand-copy">
                <h2>Cộng đồng<br>Thuê Máy Ảnh<br>Lớn nhất VN</h2>
                <p>Tìm thấy hàng ngàn góc máy, ống kính chất lượng chuẩn công nghệ cao chỉ trong vài giây.</p>
            </div>
            <div class="brand-social">
                <div class="avatar-stack">
                    <span>N</span>
                    <span>T</span>
                    <span>H</span>
                    <span class="more">+8k</span>
                </div>
                <p>Đã tham gia &amp; giao dịch tin cậy mỗi ngày.</p>
            </div>
        </div>

        <!-- RIGHT: form -->
        <div class="auth-split-right">
            <div class="auth-tabs">
                <button class="auth-tab-btn active" onclick="switchTab('login', this)">Đăng Nhập</button>
                <button class="auth-tab-btn" onclick="window.location.href='/register'">Đăng Ký</button>
            </div>

            <!-- Login form -->
            <div class="auth-tab-panel active" id="tab-login">
                <form th:action="@{/login}" method="post" style="display:contents">
                    <label>
                        <span>Địa chỉ Email</span>
                        <input name="email" type="email" autocomplete="email"
                               placeholder="bạn@email.com" required
                               oninvalid="this.setCustomValidity('Vui lòng nhập email hợp lệ!')"
                               oninput="this.setCustomValidity('')">
                    </label>
                    <label>
                        <span>Mật khẩu</span>
                        <div class="input-password-wrap">
                            <input name="password" id="login-password" type="password"
                                   autocomplete="current-password"
                                   placeholder="Mật khẩu trên 8 ký tự" required
                                   oninvalid="this.setCustomValidity('Vui lòng nhập mật khẩu!')"
                                   oninput="this.setCustomValidity('')">
                            <button type="button" class="toggle-password" aria-label="Hiện/ẩn mật khẩu"
                                    onclick="togglePassword('login-password', this)">
                                <i data-lucide="eye"></i>
                            </button>
                        </div>
                    </label>
                    <button class="button primary full auth-split-submit" type="submit">Đăng Nhập</button>
                </form>

                <!-- Divider -->
                <div class="auth-modal-divider" style="margin: 18px 0;">
                    <span>hoặc</span>
                </div>

                <!-- Google login -->
                <a class="button ghost full" th:href="@{/oauth2/authorization/google}"
                   style="display:flex;align-items:center;justify-content:center;gap:10px;min-height:48px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    <span>Đăng nhập với Google</span>
                </a>

                <p class="auth-split-note">
                    Chưa có tài khoản? <a th:href="@{/register}">Đăng ký ngay</a>
                </p>
            </div>
        </div>

    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
function switchTab(tab, btn) {
    document.querySelectorAll('.auth-tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.auth-tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + tab).classList.add('active');
}
</script>
</body>
</html>
