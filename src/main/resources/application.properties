spring.application.name=YCI_WEB

server.port=8082

spring.datasource.url = jdbc:mysql://localhost:3306/YCI
spring.datasource.username = root
spring.datasource.password = 1234

spring.jpa.hibernate.ddl-auto = update
#spring.jpa.hibernate.ddl-auto = create
#spring.jpa.hibernate.ddl-auto = none
#spring.jpa.hibernate.ddl-auto = create-drop

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.enable_lazy_load_no_trans = true

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Tắt cache Thymeleaf - tự reload template khi sửa (chỉ dùng khi dev)
spring.thymeleaf.cache=false

# Tắt cache static resources (JS/CSS) khi dev — browser luôn lấy file mới
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false

# Session timeout: 8 giờ (đủ dùng cả ngày, không bị tự đăng xuất giữa chừng)
server.servlet.session.timeout=28800s

# Google OAuth2 Login — thay bằng Client ID + Secret của bạn từ Google Cloud Console
# Hướng dẫn: https://console.cloud.google.com → APIs & Services → Credentials → Create OAuth client ID
# Authorized redirect URI: http://localhost:8082/login/oauth2/code/google
# Secrets doc tu bien moi truong (GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET) hoac file application-local.properties
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
# redirect-uri dùng {baseUrl} để tự động khớp cả localhost lẫn ngrok — không cần sửa khi đổi môi trường
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

# ── SePay Integration ──────────────────────────────────────────────────────────
# Webhook secret token — dat giống het trong SePay dashboard → Webhook → Secret Token
# Doc tu bien moi truong (SEPAY_WEBHOOK_SECRET) hoac file application-local.properties
sepay.webhook-secret=${SEPAY_WEBHOOK_SECRET:}

# SePay API Access Token (dung de query giao dich neu can)
sepay.api-token=${SEPAY_API_TOKEN:}

# Thông tin tài khoản ngân hàng nhận cọc (VietinBank - BUI TRUNG NGUYEN)
sepay.bank-code=VietinBank
sepay.account-number=100874776349
sepay.account-name=BUI TRUNG NGUYEN

# Thời hạn thanh toán QR (phút) — khách có bao nhiêu phút để quét QR
sepay.qr-expire-minutes=60

# Prefix cho mã tham chiếu — SePay sẽ match nội dung CK có chứa chuỗi này
sepay.reference-prefix=YCI

# URL công khai để SePay gọi webhook — dùng static domain ngrok, không đổi khi restart
sepay.webhook-url=https://shaded-sushi-snowplow.ngrok-free.dev/api/sepay/webhook