<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body th:attr="data-page=${pageName}">
<header th:replace="~{fragments/layout :: siteHeader}"></header>
<section th:replace="~{fragments/layout :: flash}"></section>

<main class="admin-layout">
    <aside th:replace="~{fragments/layout :: adminSidebar}"></aside>
    <section class="admin-content">

        <div class="admin-heading">
            <div>
                <p class="eyebrow">Quản lý đơn thuê</p>
                <h1>Danh sách đơn thuê &amp; lịch đặt</h1>
                <p>Nhấn vào một đơn để xem chi tiết, xác nhận, cập nhật trạng thái hoặc ghi nhận trả.</p>
            </div>
            <button class="button ghost" type="button" data-refresh-admin-bookings style="flex-shrink:0;margin-top:6px;">
                <i data-lucide="refresh-cw"></i> Tải lại
            </button>
        </div>

        <!-- Status tabs -->
        <section class="admin-tabs" data-booking-status-tabs></section>

        <!-- Toolbar -->
        <section class="toolbar">
            <div class="toolbar-search">
                <i data-lucide="search" class="toolbar-search-icon"></i>
                <input data-admin-booking-search type="search" placeholder="Tìm mã đơn, tên khách, số điện thoại...">
            </div>
            <select class="select" data-admin-booking-status>
                <option value="">Tất cả trạng thái</option>
            </select>
        </section>

        <!-- Full-width table -->
        <div class="surface table-wrap" style="padding:0;overflow:hidden;">
            <table class="data-table bookings-table">
                <thead>
                    <tr>
                        <th style="width:100px;">Mã đơn</th>
                        <th>Khách hàng</th>
                        <th>Lịch thuê</th>
                        <th>Thiết bị</th>
                        <th>Giá trị</th>
                        <th>Trạng thái</th>
                        <th style="width:60px;"></th>
                    </tr>
                </thead>
                <tbody data-admin-bookings-table></tbody>
            </table>
            <div class="pg-bar" id="pgBookings"></div>
        </div>

    </section>
</main>

<!-- ═══════════════════════════════════════════════════════════
     BOOKING DETAIL MODAL
     ═══════════════════════════════════════════════════════════ -->
<div class="bmodal-overlay" id="bookingModal" aria-modal="true" role="dialog" aria-labelledby="bmodalTitle" hidden>
    <div class="bmodal-box">

        <!-- Modal header -->
        <div class="bmodal-header">
            <div class="bmodal-title-group">
                <p class="eyebrow" id="bmodalEyebrow">Chi tiết đơn thuê</p>
                <h2 id="bmodalTitle">—</h2>
            </div>
            <div class="bmodal-header-meta" id="bmodalMeta"></div>
            <button class="bmodal-close" type="button" id="bmodalClose" aria-label="Đóng">
                <i data-lucide="x"></i>
            </button>
        </div>

        <!-- Modal body — scrollable -->
        <div class="bmodal-body" id="bmodalBody">
            <div class="empty-state small">
                <i data-lucide="loader"></i>
                <p>Đang tải...</p>
            </div>
        </div>

    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
